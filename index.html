<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Pixel's Universe</title>
    <style>
        /* 赛博朋克深色背景 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 科技感发光核心容器 */
        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                        0 0 20px rgba(0, 242, 254, 0.1);
            max-width: 600px;
            animation: fadeIn 1.5s ease-out;
        }

        /* 极其高调的霓虹渐变流光文字 */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ff007f, #7928ca);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowText 5s ease infinite;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 动态打字机效果的副标题 */
        .subtitle {
            font-size: 1.2rem;
            color: #00f2fe;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
            border-right: 2px solid #00f2fe;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            margin: 0 auto 2rem auto;
            animation: typing 3.5s steps(30, end) forwards,
                       blink 0.75s step-end infinite;
        }

        /* 高调的进入按钮 */
        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            border: 2px solid #ff007f;
            border-radius: 30px;
            background: transparent;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .btn:hover {
            background: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
            transform: scale(1.05);
            text-shadow: 0 0 5px #fff;
        }

        /* 核心动画库 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #00f2fe; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WELCOME TO PIXEL'S WORLD</h1>
        <div class="subtitle">未来已来，正在构建极客浪漫...</div>
        <!-- 这里的链接未来可以改成你大仓鼠游戏的网址，或者其他好玩的页面 -->
        <a href="#" class="btn">进入空间</a>
    </div>

</body>
</html>
